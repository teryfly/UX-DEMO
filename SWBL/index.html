<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>死亡病例讨论制度闭环管理系统 · 仿真演示</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app"></div>

  <!-- 框架（本地零依赖） -->
  <script src="lib/vue.global.prod.js"></script>

  <!-- 数据层：FHIR 内存库 → 扩展编解码 → 词表与 Profile → 领域常量 → 时限引擎 → 状态机 -->
  <script src="js/fhir-store.js"></script>
  <script src="js/fhir-ext.js"></script>
  <script src="js/fhir-codesystems.js"></script>
  <script src="js/domain.js"></script>
  <script src="js/limits.js"></script>
  <script src="js/workflow.js"></script>

  <!-- 种子：基础数据与配置 → 病例工厂 → 演示剧本与背景量 -->
  <script src="js/seed.js"></script>
  <script src="js/case-factory.js"></script>
  <script src="js/seed-cases.js"></script>

  <!-- 服务层与统计 -->
  <script src="js/services.js"></script>
  <script src="js/stats.js"></script>

  <!-- 应用壳与通用组件 -->
  <script>window.AMS = { components: {}, pages: {} };</script>
  <script src="js/components/common.js"></script>
  <script src="js/app.js"></script>

  <!-- 页面：工作台 -->
  <script src="js/pages/home.js"></script>
  <script src="js/pages/forbidden.js"></script>

  <!-- 页面：讨论管理 L2-1 / L3-1-2 / L3-1-3 -->
  <script src="js/pages/discuss-list.js"></script>
  <script src="js/pages/discuss-detail.js"></script>
  <script src="js/pages/discuss-record.js"></script>

  <!-- 页面：上报管理 L2-2 / L3-2-2 -->
  <script src="js/pages/report-list.js"></script>
  <script src="js/pages/report-form.js"></script>

  <!-- 页面：改进跟踪 L2-3 / L3-3-2 -->
  <script src="js/pages/improve-list.js"></script>
  <script src="js/pages/improve-detail.js"></script>

  <!-- 页面：统计分析 L3-4-1 ~ L3-4-7 -->
  <script src="js/pages/stat-overview.js"></script>
  <script src="js/pages/stat-dept.js"></script>
  <script src="js/pages/stat-cause.js"></script>
  <script src="js/pages/stat-trend.js"></script>
  <script src="js/pages/stat-improve.js"></script>
  <script src="js/pages/stat-timeliness.js"></script>
  <script src="js/pages/stat-report.js"></script>

  <!-- 页面：系统管理 L3-5-1 ~ L3-5-6 -->
  <script src="js/pages/sys-template.js"></script>
  <script src="js/pages/sys-timeout.js"></script>
  <script src="js/pages/sys-basedata.js"></script>
  <script src="js/pages/sys-role.js"></script>
  <script src="js/pages/sys-notify.js"></script>
  <script src="js/pages/sys-approval.js"></script>

  <!-- 启动：初始化 FHIR 基础数据与演示病例，然后挂载应用 -->
  <script>
    (function () {
      var t0 = Date.now();
      Seed.runBase();
      SeedCases.run();
      window.__SEED_MS__ = Date.now() - t0;
      window.__BOOT__();
      console.log('[SWBL] 初始化完成，种子耗时 ' + window.__SEED_MS__ + 'ms');
    })();
  </script>
</body>
</html>
